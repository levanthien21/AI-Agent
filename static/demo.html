<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Demo widget</title>
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:system-ui;max-width:700px;margin:40px auto;padding:0 16px">
  <h1>Trang web demo</h1>
  <p>Bấm bong bóng chat ở góc phải dưới để thử. Đổi <code>?domain=ten</code> trên URL để thử lĩnh vực khác.</p>
  <script>
    var s = document.createElement("script");
    s.src = "/static/widget.js";
    s.setAttribute("data-domain", new URLSearchParams(location.search).get("domain") || "cua-hang-mau");
    document.body.appendChild(s);
  </script>
</body>
</html>
